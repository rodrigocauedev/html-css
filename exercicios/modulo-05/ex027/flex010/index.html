<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        .conteiner1 {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
        }

        .item1 {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }

        #item11 {
            flex-basis: 200px;
            flex-grow: 0;
            flex-shrink: 1;
        }

        #item12 {
            flex-basis: 200px;
            flex-grow: 2;
            flex-shrink: 0;
        }

        #item13 {
            flex-basis: 200px;
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="conteiner1">
        <div class="item1" id="item11">A</div>
        <div class="item1" id="item12">B</div>
        <div class="item1" id="item13">C</div>
    </div>
</body>
</html>
