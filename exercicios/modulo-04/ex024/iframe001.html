<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 600px;
            height: 600px;
            border: 1px solid black;
        }

        p {
            font-size: 1.7em;
            font-weight: bold;
            text-indent: 30px;
        }
    </style>
</head>
<body>
    <!--frameborder tira ou coloca borda no iframe-->
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com"> <a href="https://www.cursoemvideo.com">Curso em Video</a>
    </iframe> <br> para aprender a programar.</p>

    <p>O repositório do Guanabara <iframe src="https://gustavoguanabara.github.io"> <a href="https://gustavoguanabara.github.io" target="_blank">no GitHub</a></iframe> <br> também é bem legal.</p>
</body>
</html>
