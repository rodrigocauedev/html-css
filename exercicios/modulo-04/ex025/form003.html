<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <!--
    Criamos um form para alunos pedindo seu nome e média.

    O input usado para pedir a média foi input:number e usamos os atributos "min" e "max" para dizer qual o valor mínimo e máximo.

    <input type="number" name="media" id="imedia" min="0" max="10">

    O atributo "step" diz de quanto os números podem progredir. Pode ser de 1 em 1, 0.5 em 0.5 e por ai vai.

    <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1">

    Para pedir o mês e ano de alguma coisa se usa Input:month que vai pedir o mês e ano.

    <input type="month" name="mes" id="imes" required>

    Se usar o atributo "value" dentro do input já coloca alguma coisa pré-configurada no input, mas o placeholder vai sumir.

    <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required value="5">

    Agora se você quer o dia, mês e ano se usa Input:date.

    <input type="date" name="dia" id="idia">

    Também tem a opção de colocar o "value", mas tem que ser ano-mês-dia

    Podemos pedir a hora que foi realizado algo com o input:time

    <input type="time" name="hora" id="ihora" required>
    -->
    <h1>Teste de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome:</label>
            <input type="text" name="nome" id="inome" required minlength="2" maxlength="45" size="40" placeholder="Nome completo..." autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média</label>
            <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1" required value="5">
        </p>
        <p>
            <label for="imes">Período Letivo:</label>
            <input type="month" name="mes" id="imes" required>
        </p>
        <p>
            <label for="idia">Dia da prova:</label>
            <input type="date" name="dia" id="idia">
        </p>
        <p>
            <label for="ihora">Horário da prova:</label>
            <input type="time" name="hora" id="ihora" required>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
