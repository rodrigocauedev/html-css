<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template: 80px 40px 1fr 40px / 1fr 150px;
            gap: 5px;
            justify-content: center;
        }
        
        .caixa {
            background-color: lightgray;
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            align-content: center;
        }

        #topo {
            grid-area: 1 / 1 / 2 / 3;
        }

        #menu {
            grid-area: 2 / 1 / 3 / 3;
        }

        #principal {
            grid-area: 3 / 1 / 4 / 2;
        }

        #secundario {
            grid-area: 3 / 2 / 4 / 3;
        }

        #rodape {
            grid-area: 4 / 1 / 5 / 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="caixa" id="topo">
            topo
        </header>
        <nav class="caixa" id="menu">
            menu
        </nav>
        <main class="caixa" id="principal">
            principal
        </main>
        <aside class="caixa" id="secundario">
            secundario
        </aside>
        <footer class="caixa" id="rodape">
            rodape
        </footer>
    </div>
</body>
</html>
